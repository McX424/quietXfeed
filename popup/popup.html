<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>quietXfeed</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <strong>quietXfeed</strong>
    <span class="sub">X timeline, quieter</span>
  </header>
  <label class="row">
    <input type="checkbox" id="hideMedia" />
    <span>Hide post media</span>
  </label>
  <label class="row">
    <input type="checkbox" id="autoNewest" />
    <span>Auto “Show new posts”</span>
  </label>
  <p class="hint">Photos, videos, GIFs &amp; quote media stay hidden. Avatars, emoji, and text stay.</p>
  <script src="popup.js"></script>
</body>
</html>
